services:
  # API Gateway Service - Entry point for all requests
  gateway:
    image: ghcr.io/pollak-belso-projektek/indicator_backend-gateway-service:latest
    container_name: indicator-gateway
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - LOGIN_SERVICE_URL=http://login-service:5301
      - MAIN_SERVICE_URL=http://main-service:5300
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    depends_on:
      - login-service
      - main-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/basic"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - indicator-network
    logging:
      options:
        max-size: 50m

  # Login Service - Authentication microservice
  login-service:
    image: ghcr.io/pollak-belso-projektek/indicator_backend-login-service:latest
    container_name: indicator-login
    ports:
      - "5301:5301"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5301
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5301/health/basic"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - indicator-network
    logging:
      options:
        max-size: 50m

  # Main Service - Core business logic
  main-service:
    image: ghcr.io/pollak-belso-projektek/indicator_backend-main-service:latest
    container_name: indicator-main
    ports:
      - "5300:5300"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5300
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - LOGIN_SERVICE_URL=http://login-service:5301
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_API_TOKEN=${TRELLO_API_TOKEN}
      - TRELLO_LIST_ID=${TRELLO_LIST_ID}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5300/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - indicator-network
    logging:
      options:
        max-size: 50m

  frontend:
    image: ghcr.io/pollak-belso-projektek/indicator_frontend:latest
    restart: unless-stopped
    ports:
      - 5173:80
    logging:
      options:
        max-size: 50m

  redis:
    image: redis:7-alpine
    container_name: indicator-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - indicator-network
    logging:
      options:
        max-size: 50m

networks:
  indicator-network:
    driver: bridge